[package]
name = "budel-craft"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Native Rust solver for the budel polygon packing assignment"
license = "MIT"
repository = "https://github.com/dietmarwo/budel-craft"

[features]
default = []
fcmaes = ["dep:fcmaes-core"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
num-bigint = "0.4"
rand = { version = "0.8", default-features = false, features = ["std_rng"] }
libc = "0.2"
fcmaes-core = { version = "=0.1.3", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
